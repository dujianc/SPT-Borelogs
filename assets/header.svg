<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="GeoEQ SPT Logs — free SPT borelog software">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122A52"/>
      <stop offset="1" stop-color="#1F4E9C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="960" height="240" rx="16" fill="url(#bg)"/>

  <!-- wordmark -->
  <text x="48" y="103" font-family="Segoe UI, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#FFFFFF">GeoEQ
    <tspan fill="#7FD1FF">SPT Logs</tspan></text>
  <text x="50" y="143" font-family="Segoe UI, Arial, sans-serif"
        font-size="19" fill="#D6E6FA">Free SPT borehole log software for
    geotechnical engineers</text>
  <text x="50" y="176" font-family="Segoe UI, Arial, sans-serif"
        font-size="14" fill="#9FC1EA">Excel &amp; CSV import · live borelog
    sheets · one-click project PDF · Windows</text>
  <text x="50" y="207" font-family="Segoe UI, Arial, sans-serif"
        font-size="13" fill="#6E93C8">geoeq.org</text>

  <!-- mini strata column -->
  <g>
    <rect x="628" y="28" width="34" height="42" fill="#C19A6B"/>
    <rect x="628" y="70" width="34" height="50" fill="#D9C79E"/>
    <rect x="628" y="120" width="34" height="56" fill="#F5D76E"/>
    <rect x="628" y="176" width="34" height="36" fill="#8D6E63"/>
    <rect x="628" y="28" width="34" height="184" fill="none"
          stroke="#0E2140" stroke-width="2"/>
    <!-- water table symbol -->
    <path d="M612 84 l12 0 -6 9 z" fill="none" stroke="#7FD1FF"
          stroke-width="2"/>
    <line x1="608" y1="93" x2="628" y2="93" stroke="#7FD1FF"
          stroke-width="2"/>
  </g>

  <!-- N-value graph: grid, animated curve, pulsing points -->
  <g>
    <line x1="700" y1="28" x2="700" y2="212" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1"/>
    <line x1="756" y1="28" x2="756" y2="212" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1"/>
    <line x1="812" y1="28" x2="812" y2="212" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1"/>
    <line x1="868" y1="28" x2="868" y2="212" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1"/>
    <line x1="924" y1="28" x2="924" y2="212" stroke="#FFFFFF"
          stroke-opacity="0.14" stroke-width="1"/>

    <polyline points="712,46 768,82 736,118 838,154 900,196"
              fill="none" stroke="#7FD1FF" stroke-width="3.5"
              stroke-linecap="round" stroke-linejoin="round"
              stroke-dasharray="520" stroke-dashoffset="520">
      <animate attributeName="stroke-dashoffset" from="520" to="0"
               dur="2.4s" begin="0.4s" fill="freeze"/>
    </polyline>

    <circle cx="712" cy="46" r="0" fill="#FF6B6B">
      <animate attributeName="r" from="0" to="5.5" dur="0.25s"
               begin="0.5s" fill="freeze"/>
      <animate attributeName="r" values="5.5;6.8;5.5" dur="3s"
               begin="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="768" cy="82" r="0" fill="#FF6B6B">
      <animate attributeName="r" from="0" to="5.5" dur="0.25s"
               begin="0.95s" fill="freeze"/>
      <animate attributeName="r" values="5.5;6.8;5.5" dur="3s"
               begin="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="736" cy="118" r="0" fill="#FF6B6B">
      <animate attributeName="r" from="0" to="5.5" dur="0.25s"
               begin="1.4s" fill="freeze"/>
      <animate attributeName="r" values="5.5;6.8;5.5" dur="3s"
               begin="4.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="838" cy="154" r="0" fill="#FF6B6B">
      <animate attributeName="r" from="0" to="5.5" dur="0.25s"
               begin="1.9s" fill="freeze"/>
      <animate attributeName="r" values="5.5;6.8;5.5" dur="3s"
               begin="4.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="196" r="0" fill="#FF6B6B">
      <animate attributeName="r" from="0" to="5.5" dur="0.25s"
               begin="2.4s" fill="freeze"/>
      <animate attributeName="r" values="5.5;6.8;5.5" dur="3s"
               begin="4.8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
